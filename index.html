<style>
:root{--bg:#fdf0f1;--card:#fffafa;--ink:#5a3a46;--mute:#94707d;--rose:#eaabbb;--deep:#b8587a;--soft:#f9d9df;--line:#f4cdd5;--on:#5a3a46;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:34rem;margin:0 auto;padding:1.5rem 1rem 3rem}
h1{font-size:2rem;font-weight:800;margin:0 0 1.1rem;text-align:center;color:var(--deep);letter-spacing:-.01em}
h1 span{display:inline-block;margin:0 .3rem}
.tabs,.days{display:flex;gap:.45rem;margin-bottom:1rem}
.tabs{justify-content:center;flex-wrap:nowrap;gap:.3rem;margin:0 -.5rem 1rem}
.tabs button{padding:.5rem .6rem;font-size:.95rem;white-space:nowrap}
.days{justify-content:center;flex-wrap:nowrap;gap:.3rem}
button{border:0;background:var(--soft);color:var(--deep);font:inherit;font-weight:700;padding:.5rem 1rem;border-radius:2rem;cursor:pointer;flex:0 0 auto}
button[aria-selected="true"]{background:var(--rose);color:var(--on)}
button:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.days button{padding:.35rem .55rem;font-size:.8rem}
.days button.today::after{content:"";display:inline-block;width:.4rem;height:.4rem;border-radius:50%;background:var(--deep);margin-left:.35rem;vertical-align:middle}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.2rem;padding:1rem 1.1rem;margin-bottom:.8rem}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;margin-bottom:.4rem}
h2{font-size:1.15rem;margin:0;color:var(--deep)}
.chip{background:var(--soft);color:var(--deep);font-size:.85rem;font-weight:700;padding:.1rem .65rem;border-radius:1rem;white-space:nowrap}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:3.1rem 1rem 1fr;gap:.6rem;padding:.55rem 0;position:relative}
.tl li::after{content:"";position:absolute;left:3.1rem;margin-left:calc(.6rem + .5rem - 1px);top:1.55rem;bottom:-.55rem;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tm{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.dot{width:.9rem;height:.9rem;border-radius:50%;margin-top:.3rem;background:var(--line);position:relative;z-index:1}
.tl li.past .tm,.tl li.past .ti{color:var(--mute)}.tl li.past .dot{background:var(--rose)}.tl li.now .tm,.tl li.now .ti{color:var(--deep)}.tl li.now .dot{background:var(--deep);box-shadow:0 0 0 4px var(--soft)}
.ti{font-weight:700}
.sm{display:block;color:var(--mute);font-weight:400;font-size:.9rem}
ul.h{margin:.3rem 0 0;padding:0;list-style:none}
ul.h li{padding:.35rem 0 .35rem 1.5rem;position:relative;border-top:1px solid var(--line)}
ul.h li:first-child{border-top:0}
ul.h li::before{content:"♡";position:absolute;left:0;color:var(--rose)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.25rem .8rem;font-size:.95rem}
dt{color:var(--mute);font-weight:600}
dd{margin:0}
.note{color:var(--mute);font-size:.9rem;margin:.6rem 0 0}
.tw{margin:0 -.5rem;border-radius:1rem;border:1px solid var(--line);background:var(--card);overflow:hidden}
.jt{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.66rem;line-height:1.2}
.jt th,.jt td{padding:.3rem .15rem;border:1px solid var(--line);text-align:center;vertical-align:middle;overflow-wrap:anywhere}
.jt thead th{background:var(--soft);color:var(--ink);font-size:.7rem;white-space:nowrap}
.jt col.a{width:2.6rem}.jt col.b{width:2.3rem}
.jt tbody th{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700;font-size:.55rem}
.jt .n{font-weight:800;color:var(--ink)}
.jt .fr td,.jt .fr th{color:var(--ink);font-size:.55rem;padding:.1rem .15rem}
.jt .fr .n{color:var(--ink);font-weight:600}
.jt .c{background:var(--soft);font-weight:600}
.jt .i{background:var(--rose);color:var(--ink);font-weight:700}
.jt .u{background:var(--soft);color:var(--ink);font-weight:700}

.jt tr.now th,.jt tr.now .n{background:var(--rose);font-weight:800}
.jt td.nw{background:var(--rose);box-shadow:inset 0 0 0 2px var(--deep);font-weight:800}
.mc{cursor:pointer}
.mc .hint{color:var(--deep);font-size:.8rem;font-weight:700;white-space:nowrap}
.mc.open{margin-bottom:.3rem}
.rec{background:var(--soft);border:1px solid var(--line);border-radius:1.2rem;padding:1rem 1.1rem;margin:0 .5rem .8rem;cursor:pointer}
.rec h3{margin:0 0 .3rem;font-size:1rem;color:var(--deep)}
.rl{font-weight:800;margin:.6rem 0 .1rem;font-size:.85rem}
.rec ol{margin:.2rem 0 0;padding-left:1.2rem}
.rec ol li{padding:.25rem 0}
.rec ul.h{margin:.1rem 0 0}
.grid{position:relative;margin-top:.5rem}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:.7rem;color:var(--mute)}
.hl span{position:absolute;top:-.6rem;left:0;background:var(--card);padding-right:.3rem;font-variant-numeric:tabular-nums}
.evs{position:absolute;left:3rem;right:0;top:0;bottom:0}
.ev{position:absolute;background:var(--soft);border-left:3px solid var(--rose);border-radius:.5rem;padding:.1rem .4rem;font-size:.74rem;line-height:1.3;overflow:hidden;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
.ev b{color:var(--deep);font-weight:800}
.ev.job{background:var(--rose);border-left-color:var(--deep)}
.ev.in{background:var(--card);border:1px solid var(--deep);z-index:2}
.ev .d{display:none;color:var(--mute);font-size:.7rem;white-space:normal}
.ev.tall .d{display:block}
.ev.job .d{color:var(--ink)}
.nl{position:absolute;left:2.4rem;right:0;border-top:2px solid var(--deep);z-index:3}
.nl::before{content:"";position:absolute;left:-.3rem;top:-.35rem;width:.6rem;height:.6rem;border-radius:50%;background:var(--deep)}
</style>
</head>
