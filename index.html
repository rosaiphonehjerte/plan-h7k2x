<style>

<body>
<div id="bg" aria-hidden="true"></div>
<main>
<h1 id="hi"></h1>
<p class="sub" id="dt"></p>
<div class="days" id="days" role="group" aria-label="Velg dag"></div>
<div id="v"></div>
</main>
<script>
let NW=0,NH=0,tk=0,LX=.3,LY=.12,TX=.3,TY=.12,raf=0;
function light(){
  const vw=innerWidth,vh=innerHeight;
  document.querySelectorAll(".g,.days button").forEach(e=>{const r=e.getBoundingClientRect();
    e.style.setProperty("--hx",((LX*vw-r.left)/r.width*100).toFixed(1)+"%");
    e.style.setProperty("--hy",((LY*vh-r.top)/r.height*100).toFixed(1)+"%");
    const a=Math.atan2(LY*vh-(r.top+r.height/2),LX*vw-(r.left+r.width/2))*180/Math.PI+90;
    e.style.setProperty("--ang",a.toFixed(0)+"deg")});
}
function place(){
  light();
  if(!NW)return;
  const bg=document.getElementById("bg").getBoundingClientRect(),vw=bg.width,vh=bg.height,
        k=Math.max(vw/NW,vh/NH),w=NW*k,h=NH*k,ox=(vw-w)*.47+bg.left,oy=(vh-h)*.30+bg.top,R=document.documentElement.style;
  R.setProperty("--bw",w+"px");R.setProperty("--bh",h+"px");
  document.querySelectorAll(".g").forEach(e=>{const r=e.getBoundingClientRect();
    e.style.setProperty("--bx",(ox-r.left+16)+"px");e.style.setProperty("--by",(oy-r.top+16)+"px")});
}
function tick(){if(!tk){tk=1;requestAnimationFrame(()=>{tk=0;place()})}}
function glide(){raf=0;LX+=(TX-LX)*.12;LY+=(TY-LY)*.12;light();
  if(Math.abs(TX-LX)+Math.abs(TY-LY)>.002)raf=requestAnimationFrame(glide)}
function aim(x,y){TX=Math.max(0,Math.min(1,x));TY=Math.max(0,Math.min(1,y));if(!raf)raf=requestAnimationFrame(glide)}
(function(){
  const R=document.documentElement.style,dp=Math.min(devicePixelRatio||1,2),
        W=Math.round(innerWidth*dp),H=Math.round(Math.max(innerHeight,(screen.height||0)*.0+innerHeight)*dp*1.0),
        c=document.createElement("canvas");c.width=W;c.height=H;NW=W;NH=H;
  const x=c.getContext("2d");
  x.fillStyle="#f2d4db";x.fillRect(0,0,W,H);
  x.save();x.translate(W*.5,H*.47);x.scale(W*.38,H*.62);
  const q=x.createRadialGradient(0,0,0,0,0,1);
  q.addColorStop(0,"rgba(229,173,188,1)");q.addColorStop(.3,"rgba(233,181,194,1)");q.addColorStop(.62,"rgba(233,198,208,.55)");q.addColorStop(1,"rgba(242,212,219,0)");
  x.fillStyle=q;x.fillRect(-1,-1,2,2);x.restore();
  const s=x.getImageData(0,0,W,H),o=x.createImageData(W,H),a=s.data,d=o.data,A=6*dp;
  c.toBlob(bw=>{
    for(let y=0;y<H;y++)for(let X=0;X<W;X++){
      const dx=A*Math.sin(y*.03/dp+Math.sin(X*.02/dp)*2),dy=A*Math.sin(X*.028/dp+Math.sin(y*.024/dp)*2);
      const sx=Math.min(W-1,Math.max(0,Math.round(X+dx))),sy=Math.min(H-1,Math.max(0,Math.round(y+dy))),i=(sy*W+sx)*4,j=(y*W+X)*4;
      d[j]=a[i];d[j+1]=a[i+1];d[j+2]=a[i+2];d[j+3]=255;
    }
    x.putImageData(o,0,0);
    c.toBlob(bl=>{R.setProperty("--lens","url("+URL.createObjectURL(bl)+")");place()},"image/png");
  },"image/png");
  addEventListener("scroll",tick,{passive:true});
  addEventListener("resize",tick);
  document.addEventListener("toggle",tick,true);
})();
const DN=["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];
const MID=["Ovnsbakte kyllinglår, kål og 2 poteter","Omelett med grønnsaker og ost","Kyllinglår (rester), kål og 2 poteter","Kjøttdeig-kålpanne (lag dobbel porsjon)","Taco-salat med kjøttdeigen fra torsdag","Burger uten brød i salatblad, kål eller frosne grønnsaker","Ovnsbakte kyllinglår, kål og 2 poteter"];
const LU=["Grovt knekkebrød med ost og salami, agurk og kokt egg eller kesam","Eggerøre med ost og tomat","Kokte egg, kesam og agurk"];
const WO=[
["Underkropp",["Goblet-knebøy til stol med kettlebell (8 kg), senk deg sakte, 3×10–12","Rumensk markløft med kettlebell, 2×10–12","Utfall bakover med støtte, kettlebell i én hånd, 2×8 per side","Hoftehev på matta med kettlebell på hoftene, 2×12–15","Sidesteg med strikk rundt anklene eller lårene, 2×12 per side","Tåhev på et trappetrinn, 2×15","Rulle ut spente muskler, ca. 5 min"]],
["Fysio",["Ryggsenk på alle fire, senk ryggen ned med armene rett frem, 12×3","Strikk festet på et håndtak, dra til deg med armene i 90 grader inntil kroppen, 12×3","Strikk, armene i 90 grader inntil kroppen, vri én arm ut fra kroppen med albuen inn mot deg mens den andre hånden holder igjen, 12×3 per arm","Strikk, armene i 90 grader med hendene opp mot taket, strekk strikken mens du løfter opp og ned til startposisjon"]],
["Overkropp",["Strikk-nedtrekk, strikken festet høyt i en dør, dra ned mot brystet, 2×10–12","Strikkeroing, strikken festet i et dørhåndtak, dra mot deg, 2×10–12","Armhevinger mot kjøkkenbenk eller vegg, 2×8–12","Triceps med strikk, festet høyt, press ned, 2×12","Bicepscurl med strikk (stå på strikken), 2×12","Planke på knærne eller med hendene på en benk, 3×20–30 sek","Rulle ut spente muskler, ca. 5 min"]],
["Hele kroppen",["Rumensk markløft med kettlebell, 2×10","Utfall med støtte, 2×8 per side","Strikk-nedtrekk, 2×10–12","Armhevinger mot kjøkkenbenk eller vegg, 2×8–12","Dead bug på matta, 2×8 per side","Rolig gange 10 min, gjerne som en tur med Aiko","Rulle ut spente muskler, ca. 5 min"]]
];
const WI=[0,1,2,1,3,1,-1];
const SHOP=[["Kjøtt og egg",["Kjøttdeig","Kyllinglår","Egg","Salami eller skinke"]],["Meieri",["Gresk yoghurt","Kesam","Ost"]],["Grønnsaker",["Hvitkål eller spisskål","Poteter","Løk","Salat","Tomat","Agurk","Paprika","Frosne grønnsaker (brokkoli og blomkål)"]],["Ellers",["Taco-krydder","Majones","Grovt knekkebrød","Frosne blåbær","Nøtter og salte peanøtter"]],["Har fra før",["Tahini","Mandelsmør","Presset og tørket kokosnøtt"]]];
const SK=["15:10","14:10","15:30","","14:10"],TT=["16:00","","16:00","","16:00"],TRN=["Underkropp","","Overkropp","","Hele kroppen"];
const mn=t=>+t.slice(0,2)*60+ +t.slice(3);
const ad=(t,m)=>{const x=mn(t)+m;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")};
function evs(i){
  const wk=i<5,E=[],A=(a,b,t,x="")=>E.push([a,b,t,x]);
  const ds=i===2?"17:00":"17:30",wt=i<3?(i===2?"18:10":"18:30"):"19:30";
  if(wk){
    A("07:40","08:00","Morgentur med Aiko");
    A("08:30",SK[i]||"15:00",i===3?"Verv UDF":"Arbeid",i===3?"Frikjøpt til vervet":"");
    A("10:00","10:15","Frokost");
    const l=i===4?"11:40":"11:00";A(l,ad(l,20),"Lunsj");
    A("14:30","14:45","Mellommåltid");
    if(TT[i])A(TT[i],ad(TT[i],45),"Trening",TRN[i]);
    if(i===1||i===3)A("15:45","16:05","Fysioøvelser");
    if(i===0)A("15:15","15:55","Handle for uka");
  }else{
    A("09:15","09:35","Morgentur med Aiko");A("10:00","10:15","Frokost");
    if(i===5)A("11:00","11:20","Fysioøvelser");
    A("13:00","13:30","Lunsj");A("15:30","15:45","Mellommåltid");
  }
  A(ds,ad(ds,60),"Middag",MID[i]);A(wt,ad(wt,20),"Kveldstur med Aiko");
  if(i===0)A("19:00","20:30","Korps");
  if(i===1)A("19:00","21:00","Strikkeklubb");
  if(i===2)A("18:30","21:00","D&amp;D");
  wk?A("22:00","23:15","Roe ned","Sove senest 23:15"):A("22:45","24:00","Roe ned","Sove senest 00:00");
  return E.sort((p,q)=>mn(p[0])-mn(q[0])||mn(p[1])-mn(q[1]));
}
const TD=["Man","Tir","Ons","Tor","Fre"];
const TP=[
["08:30","09:15","1","l",["Norsk 6/7","Norsk 6/7","","","Norsk 8/9"]],
["09:15","10:00","2","l",["Norsk 8/9","Norsk 6/7","","","Norsk 8/9"]],
["10:00","10:15","FRI","b",["","","","",""]],
["10:15","11:00","3","l",["","","Nynorsk 10","","Lesetime 6/7"]],
["11:00","11:20","SPI","b",["","","","","6/7"]],
["11:20","11:40","FRI","b",["9","9","","","8–10"]],
["11:40","12:25","4","l",["","Nynorsk 8/9","Skrift 6/7","","Lesetime 10"]],
["12:25","12:35","FRI","b",["","","","",""]],
["12:35","13:20","5","l",["","Norsk 10","","","Norsk 10"]],
["13:20","13:25","FRI","b",["","","","",""]],
["13:25","14:10","6","l",["Lesetime 8/9","Norsk 10","Planmøte","",""]],
["14:10","15:30","7","l",["Teammøte","","","",""]]
];
function jobState(){
  const T=new Date(),wd=(T.getDay()+6)%7,nm=T.getHours()*60+T.getMinutes(),s={wd:wd,row:-1,vv:false};
  if(wd>4)return s;
  s.vv=wd===3&&nm>=mn("08:30")&&nm<mn("15:30");
  TP.forEach((r,k)=>{if(mn(r[0])<=nm&&nm<mn(r[1]))s.row=k});
  return s;
}
function jobStat(){
  const s=jobState();
  if(s.wd>4)return null;
  if(s.vv)return ["Verv UDF","Frikjøpt til vervet"];
  if(s.row<0)return null;
  const r=TP[s.row],c=r[4][s.wd],t=r[0]+"–"+r[1];
  if(s.wd===2&&s.row>=10)return ["Planmøte","13:25–15:30"];
  if(r[3]==="b"){const n=r[2]==="SPI"?"Spisepause":"Friminutt";return c?["Inspeksjon "+c,n+" "+t]:[n,t]}
  return c?[c,"Time "+r[2]+" · "+t]:["Ledig time","Time "+r[2]+" · "+t];
}
let jobManual=null,lastAuto=null;
function workEnd(wd){if(wd===2||wd===3)return TP[TP.length-1][1];for(let k=TP.length-1;k>=0;k--)if(TP[k][4][wd])return TP[k][1];return"15:30"}
function workNow(){const T=new Date(),wd=(T.getDay()+6)%7,nm=T.getHours()*60+T.getMinutes();return wd!==3&&wd<5&&nm>=480&&nm<mn(workEnd(wd))}
function jobIsOpen(){const a=workNow();if(a!==lastAuto){lastAuto=a;jobManual=null}return jobManual===null?a:jobManual}
function jobTile(){
  const st=jobStat();
  return `<button class="g tile job${st?" live":""}" data-sheet="1" type="button" aria-expanded="${jobIsOpen()}"><span class="ic">${I("heart")}</span><span class="tx"><span class="lb">Arbeid</span><br><b>${st?st[0]:"Timeplan"}</b>${st?`<small>${st[1]}</small>`:""}</span><i class="ch"></i></button>`;
}

function auLoad(){fetch(AURL).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{

function auCard(){
